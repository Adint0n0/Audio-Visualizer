<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Template rendering test</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module">
      import { templates } from '../src/templates'
      import { parseProject } from '../src/model'
      import { defaultAnalysis, FeatureBuilder, readFrame, silentFrame } from '../src/analysis'
      import { makeMusicFixture } from './fixtures/rhythm'
      import { SceneRenderer } from '../src/scene'
      const canvas = document.getElementById('scene')
      const scene = new SceneRenderer(canvas)
      const gl = scene.renderer.getContext()
      const inputs = new Map()
      const projects = new Map()
      function sourceFrame(genre) {
        if (genre === 'silence') return () => silentFrame
        if (!inputs.has(genre)) {
          const { left, right, rate, duration } = makeMusicFixture(genre, 6)
          const builder = new FeatureBuilder(rate, duration, defaultAnalysis)
          builder.push(0, left, right)
          inputs.set(genre, builder.finish())
        }
        return (t) => readFrame(inputs.get(genre), t)
      }
      window.ids = templates.map((t) => t.id)
      window.renderTemplate = (id, w, h, save, music = 'dance', time = 2.39, colorway = 'original') => {
        const key = id + '/' + colorway
        if (!projects.has(key)) {
          const template = templates.find((t) => t.id === id)
          projects.set(key, parseProject(JSON.parse(JSON.stringify(template.create(colorway)))))
        }
        const project = projects.get(key)
        const frameAt = sourceFrame(music)
        scene.resize(w, h)
        scene.render(project, time, frameAt(time), { frameAt })
        const pixels = new Uint8Array(w * h * 4)
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels)
        if (gl.getError() !== gl.NO_ERROR) throw Error('WebGL error in ' + id)
        const bg = [1, 3, 5].map((i) => parseInt(project.background.color.slice(i, i + 2), 16))
        let brightPixels = 0,
          lumMax = 0,
          clipped = 0,
          intensity = 0,
          hash = 0x811c9dc5
        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i],
            g = pixels[i + 1],
            b = pixels[i + 2]
          const delta = Math.max(Math.abs(r - bg[0]), Math.abs(g - bg[1]), Math.abs(b - bg[2]))
          if (delta > 10) brightPixels++
          if (r > 250 && g > 250 && b > 250) clipped++
          intensity += (r * 0.2126 + g * 0.7152 + b * 0.0722) / 255
          lumMax = Math.max(lumMax, delta)
          hash = Math.imul((hash ^ ((r << 16) | (g << 8) | b)) >>> 0, 16777619)
        }
        return {
          luminanceVariation: lumMax,
          brightPixels,
          clipped: clipped / (w * h),
          mean: intensity / (w * h),
          hash: hash >>> 0,
          uri: save ? canvas.toDataURL('image/webp', 0.92) : null,
        }
      }
      window.finishRenderer = () => scene.dispose()
    </script>
  </body>
</html>
